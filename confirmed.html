<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Cuenta confirmada — Antójate</title>
  <style>
    body {
      margin: 0;
      background: #F7F3EA;
      font-family: -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
      color: #3A372F;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px 16px;
      box-sizing: border-box;
    }
    .card {
      background: #FFFFFF;
      border: 1px solid #E8E2D6;
      border-radius: 20px;
      max-width: 420px;
      width: 100%;
      padding: 40px 28px;
      text-align: center;
      box-shadow: 0 8px 28px rgba(50, 130, 70, 0.08);
    }
    .logo { width: 72px; height: 72px; margin-bottom: 12px; }
    .check {
      font-size: 44px;
      margin: 4px 0 6px;
    }
    h1 {
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 26px;
      color: #22201C;
      margin: 6px 0 10px;
      letter-spacing: -0.4px;
    }
    p { font-size: 15px; line-height: 22px; margin: 0 0 10px; color: #55503F; }
    .steps {
      background: #F0F7F1;
      border-radius: 14px;
      padding: 14px 16px;
      font-size: 14px;
      line-height: 21px;
      color: #2C5E3B;
      margin: 18px 0 6px;
      text-align: left;
    }
    .foot { font-size: 12px; color: #A39B8B; margin-top: 22px; }
  </style>
</head>
<body>
  <div class="card">
    <img class="logo" src="logo.png" alt="Antójate">
    <div class="check">✅</div>
    <h1>¡Cuenta confirmada!</h1>
    <p>Tu correo quedó verificado. Ya está todo listo para cocinar.</p>
    <div class="steps">
      <strong>Ahora:</strong> vuelve a la app <strong>Antójate</strong> en tu teléfono y entra con tu correo y contraseña.
    </div>
    <p style="font-size:13px; color:#8A8374; margin-top:12px;">¿Dudas? Escríbenos a hola.antojate@gmail.com</p>
    <div class="foot">Antójate · Cocina con lo que hay</div>
  </div>
</body>
</html>
